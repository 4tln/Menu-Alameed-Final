<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#5b3939">
  <title>فطائر العميد</title>
  <link rel="stylesheet" href="style.css">

  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="فطائر العميد">

</head>
<body>
  <header class="hero">
    <div class="hero-wave"></div>
    <div class="hero-content">
      <img class="logo" src="logo.jpg" alt="شعار فطائر العميد">
      <div class="hero-copy">
        <h1>فطائر العميد</h1>
        <p>اطلب بكل سهولة عبر واتساب</p>
        <div class="visitor-counter" aria-live="polite">👥 عدد الزوار: <strong id="visitorCount">—</strong></div>
      </div>
      <div class="quick-actions">
        <a class="quick-btn" href="tel:0536261408">☎ اتصل بنا</a>
        <button class="quick-btn" id="shareBtn" type="button">↗ مشاركة</button>
        <button class="quick-btn" id="refreshBtn" type="button" aria-label="تحديث الصفحة">↻ تحديث الصفحة</button>
      </div>
    </div>
  </header>
  <div class="sticky-tools">
    <label class="search-box">
      <span>🔎</span>
      <input id="searchInput" type="search" placeholder="ابحث عن صنف..." autocomplete="off">
    </label>
    <nav id="categoryTabs" class="category-tabs" aria-label="أقسام المنيو"></nav>
  </div>

  <main id="menuArea" class="menu-area"></main>

  <nav class="bottom-nav" aria-label="التنقل الرئيسي">
    <button class="nav-item active" type="button">⌂<span>الرئيسية</span></button>
    <button class="nav-item" type="button" id="ordersNav">▣<span>الطلبات</span></button>
    <button class="nav-item" type="button" id="favoritesNav">♡<span>المفضلة</span></button>
    <button class="nav-item" type="button">•••<span>المزيد</span></button>
    <button id="cartBar" class="cart-bar" type="button">
      <span class="cart-icon">🛒<b id="cartCount">0</b></span>
      <span>السلة<small><b id="cartTotal">0</b> ر.س</small></span>
      <i>‹</i>
    </button>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <div id="cartModal" class="modal" aria-hidden="true">
    <div class="modal-backdrop" data-close-modal></div>
    <section class="sheet" role="dialog" aria-modal="true" aria-label="سلة الطلب">
      <header class="sheet-header">
        <h2>سلة الطلب</h2>
        <button type="button" class="icon-btn" data-close-modal>×</button>
      </header>

      <div id="cartItems" class="cart-items"></div>

      <div class="cart-summary cart-summary-pro">
        <div class="summary-meta">
          <span>عدد المنتجات: <b id="sheetCount">0</b></span>
          <small>الأسعار تشمل تأمين الصحن عند وجوده</small>
        </div>
        <div class="summary-total">
          <span>الإجمالي</span>
          <strong><span id="sheetTotal">0</span> ريال</strong>
        </div>
      </div>

      <button id="clearCartBtn" class="danger-btn" type="button">إفراغ السلة</button>

      <div class="order-box">
        <h3>نوع الطلب</h3>
        <div class="order-types">
          <label><input type="radio" name="orderType" value="استلام" checked> استلام</label>
          <label><input type="radio" name="orderType" value="توصيل"> توصيل</label>
        </div>

        <label class="field-label" for="phoneInput">رقم الجوال *</label>
        <input id="phoneInput" class="field" type="tel" inputmode="numeric" maxlength="10" placeholder="05XXXXXXXX">

        <div id="locationWrap" hidden>
          <div class="location-status"><span>🚚</span><span>يتم تحديد رسوم التوصيل من قبل المطعم بعد استلام الطلب.</span></div>
          <label class="field-label">موقع التوصيل *</label>
          <div id="locationStatus" class="location-status loading" role="status">
            <span id="locationStatusIcon">⏳</span>
            <span id="locationStatusText">جارٍ تحديد موقعك...</span>
          </div>
          <button id="retryLocationBtn" class="retry-location-btn" type="button" hidden>📍 إعادة تحديد الموقع</button>
          <input id="locationInput" type="hidden">

          
        </div>

        <label class="field-label" for="notesInput">ملاحظات الطلب</label>
        <textarea id="notesInput" class="field" rows="3" placeholder="مثال: بدون شطة"></textarea>

        <button id="sendOrderBtn" class="whatsapp-btn" type="button">إرسال الطلب عبر واتساب</button>
      </div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js" onerror="this.onerror=null;this.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'"></script>
  <script src="menu-data.js"></script>
  <script src="script.js"></script>

<script>
const refreshBtn = document.getElementById('refreshBtn');
if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
refreshBtn?.addEventListener('click', () => {
  if (refreshBtn.classList.contains('is-refreshing')) return;
  refreshBtn.classList.add('is-refreshing');
  refreshBtn.setAttribute('aria-busy', 'true');
  window.scrollTo({ top: 0, left: 0, behavior: 'smooth' });
  window.setTimeout(() => {
    window.scrollTo(0, 0);
    window.location.reload();
  }, 850);
});
</script>

</body>
</html>
